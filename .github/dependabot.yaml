version: 2
updates:
  # npm (root monorepo — workspaces cover packages/* and plugins/*)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps-dev)"

  # composer (every plugin, so new plugins are covered without an entry here)
  - package-ecosystem: "composer"
    directories:
      - "/plugins/*"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps-dev)"

  # github-actions (workflows and the composite actions they use)
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
